name: Windows Desktop (free RDP)
on: workflow_dispatch
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: 启用RDP并设置账号
        shell: pwsh
        run: |
          Set-LocalUser -Name "runneradmin" -Password ("P@ssw0rd1234"|ConvertTo-SecureString -AsPlainText -Force)
          Set-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" fDenyTSConnections 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
      - name: 安装并接入Tailscale
        shell: pwsh
        timeout-minutes: 3
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          choco install tailscale -y --no-progress
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=win-rdp | Out-Null
          Start-Sleep 10
          $ip = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4) -join ""
          if ([string]::IsNullOrWhiteSpace($ip)) { Write-Error "Tailscale 未获得IP, 请检查 TAILSCALE_AUTH_KEY 是否有效"; exit 1 }
          Write-Host "RDPIP: $ip"
          while($true){Start-Sleep 3600}
